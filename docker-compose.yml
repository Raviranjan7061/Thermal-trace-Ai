version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: thermaltrace-postgis
    environment:
      POSTGRES_DB: thermaltrace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermaltrace-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/thermaltrace_db
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY:-}
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thermaltrace-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
