[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermaltrace-backend"
version = "1.0.0"
description = "Satellite-Based Industrial Thermal Anomaly Intelligence Platform Backend"
authors = [{ name = "ThermalTrace AI Team" }]
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
